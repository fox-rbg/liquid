<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel – BLUSH VAPE</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --bg: #0d0d12; --card: #16161f; --pink: #ff6b9d; --pink-soft: #ff8fb3;
      --text: #f0f0f5; --muted: #a0a0b0; --border: #2a2a3a;
      --ok: #3dd68c; --bad: #ff6b6b; --unk: #ffc857;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
    .wrap { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: 0.3rem; background: linear-gradient(135deg, var(--pink), #ffb6c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1rem; line-height: 1.4; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; color: var(--pink-soft); margin-bottom: 0.4rem; }
    input, textarea {
      width: 100%; background: #0f0f16; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); padding: 0.7rem 0.85rem; font-size: 0.95rem; font-family: inherit;
    }
    textarea { min-height: 200px; resize: vertical; line-height: 1.45; }
    button {
      margin-top: 0.75rem; width: 100%; border: none; border-radius: 10px; padding: 0.85rem;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; background: var(--pink); color: #111;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 0.45rem; }
    .err { color: var(--bad); font-size: 0.85rem; margin-top: 0.5rem; }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.45rem; line-height: 1.4; }
    #gate { max-width: 400px; margin: 15vh auto 0; }
    #app { display: none; }
    .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
    .tabs button {
      margin: 0; flex: 1; background: #1a1a24; color: var(--muted); border: 1px solid var(--border);
    }
    .tabs button.on { background: rgba(255,107,157,.2); color: var(--pink-soft); border-color: var(--pink); }
    .panel { display: none; }
    .panel.on { display: block; }
    .stats { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.8rem 0; }
    .stat { flex: 1; min-width: 100px; background: #0f0f16; border: 1px solid var(--border); border-radius: 10px; padding: 0.65rem; text-align: center; }
    .stat b { display: block; font-size: 1.35rem; }
    .stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.unk b { color: var(--unk); }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
    .tag { font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 999px; white-space: nowrap; }
    .tag.ok { background: rgba(61,214,140,.15); color: var(--ok); }
    .tag.bad { background: rgba(255,107,107,.15); color: var(--bad); }
    .tag.unk { background: rgba(255,200,87,.12); color: var(--unk); }
    .tag.skip { background: rgba(160,160,176,.12); color: var(--muted); }
    .tag.gotowka { background: rgba(61,214,140,.15); color: var(--ok); }
    .tag.przelew { background: rgba(255,107,157,.15); color: var(--pink-soft); }
    .order-card { border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.7rem; background: #0f0f16; }
    .order-card h4 { font-size: 0.95rem; margin-bottom: 0.35rem; }
    .summary-box { background: #0f0f16; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-top: 1rem; font-size: 0.85rem; line-height: 1.5; }
    .summary-box h3 { margin-bottom: 0.6rem; color: var(--pink-soft); }
  </style>
</head>
<body>
  <div id="gate" class="wrap">
    <div class="card">
      <h1>Blush Vape – panel</h1>
      <p class="sub">Dostęp tylko dla upoważnionych</p>
      <label for="pw">Hasło</label>
      <input type="password" id="pw" placeholder="Hasło" autocomplete="current-password" />
      <button type="button" id="btnLogin">Wejdź</button>
      <p class="err" id="loginErr" hidden>Złe hasło</p>
    </div>
  </div>

  <div id="app" class="wrap">
    <h1>Panel</h1>
    <p class="sub">Sprawdzanie listy smaków i podgląd zamówień</p>

    <div class="tabs">
      <button type="button" class="on" data-tab="check">Lista smaków</button>
      <button type="button" data-tab="orders">Zamówienia</button>
    </div>

    <div id="panel-check" class="panel on">
      <div class="card">
        <label for="list">Wklej listę zamówień / smaków</label>
        <textarea id="list" placeholder="34. vozol love 777&#10;35. Yami Pink lemonade"></textarea>
        <p class="hint">Numery, imiona, marki – system wyciągnie smaki i sprawdzi w availability.json</p>
        <button type="button" id="btnCheck">Sprawdź dostępność</button>
      </div>
      <div id="results" hidden>
        <div class="stats">
          <div class="stat ok"><b id="nOk">0</b>dostępne</div>
          <div class="stat bad"><b id="nBad">0</b>niedostępne</div>
          <div class="stat unk"><b id="nUnk">0</b>nieznane</div>
        </div>
        <div class="card" id="resultList"></div>
      </div>
    </div>

    <div id="panel-orders" class="panel">
      <div class="card">
        <p class="hint">Zamówienia z Supabase.</p>
        <button type="button" id="btnRefreshOrders" class="secondary">Odśwież</button>
        <button type="button" id="btnClearOrders" class="secondary" style="border-color:#ff6b6b;color:#ff6b6b">Wyczyść wszystkie zamówienia</button>
      </div>
      <div id="ordersList"></div>
      <div id="summaryBox" class="summary-box" hidden></div>
    </div>

    <button type="button" class="secondary" id="btnLogout">Wyloguj</button>
  </div>

<script>
const PASS = "blush2026";
const AVAIL_URL = "../availability.json";
let isUnlocked = false;
const SUPABASE_URL = "https://zlrmfyulhuyvsjotldju.supabase.co";
const SUPABASE_KEY = "sb_publishable_2neAkxZzfd0VMvcr0omR_w_GbVN4aYq";

const BRAND_RE = /\b(vozol|prime|yami|elf\s*liq|elfliq|elf|fumot|puffy|oxva|liquid)\b/gi;

function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/bluberry|blubery/g, "blueberry").replace(/pomagranate/g, "pomegranate")
    .replace(/fruite/g, "fruit").replace(/tabaca|tabacco/g, "tobacco")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function detectBrand(text) {
  const t = text.toLowerCase();
  if (/vozol|prime/.test(t)) return "vozol";
  if (/yami/.test(t)) return "yami";
  if (/elf\s*liq|elfliq|\belf\b/.test(t)) return "elf_liq";
  if (/fumot/.test(t)) return "fumot";
  if (/puffy/.test(t)) return "puffy";
  if (/oxva/.test(t)) return "oxva";
  return null;
}
function parseLine(raw) {
  let line = raw.trim();
  if (!line) return null;
  const onlyName = line.replace(/[\d.\)\s✅❎\-]/g, "");
  if (/^(mary[sś]ka|ewa|ja|milena|gruby|ku[zź]niarz|krawczykowa|elfliq)$/i.test(onlyName))
    return { skip: true, raw: line, reason: "imię / nagłówek" };
  line = line.replace(/^\s*\d+[\.\)\-\:]?\s*/i, "").replace(/[✅❎✔️❌☑☐]/g, " ").trim();
  const isFree = /darmow/i.test(line);
  line = line.replace(/\b(ten\s+)?darmow\w*\b/gi, " ").trim();
  line = line.replace(/,?\s*catridge.*$/i, "").replace(/,?\s*cartridge.*$/i, "").trim();
  if (!line || /^cokolwiek$/i.test(line)) return { skip: true, raw, reason: "brak smaku" };
  const brand = detectBrand(line);
  let flavor = line.replace(BRAND_RE, " ").replace(/\b30ml\b|\b50mg\b|\b20mg\b/gi, " ").replace(/\s+/g, " ").trim();
  if (!flavor || flavor.length < 2) return { skip: true, raw, reason: "brak smaku" };
  return { skip: false, raw, flavor, brand, isFree, num: (raw.match(/^\s*(\d+)/) || [])[1] || "" };
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function getLiquidPricePerPiece(totalQty) {
  if (totalQty >= 100) return 26;
  if (totalQty >= 50) return 28;
  if (totalQty >= 20) return 32;
  if (totalQty >= 10) return 35;
  if (totalQty >= 5) return 40;
  if (totalQty >= 3) return 45;
  return 45;
}

function countLiquidsFromOrders(orders) {
  let total = 0;
  orders.forEach(o => {
    const qty = parseInt(o.sztuk, 10) || 0;
    total += qty;
  });
  return total;
}

function unlock() {
  isUnlocked = true;
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  renderOrders();
}
function lock() {
  isUnlocked = false;
  document.getElementById("gate").style.display = "block";
  document.getElementById("app").style.display = "none";
}
document.getElementById("btnLogin").onclick = () => {
  if (document.getElementById("pw").value === PASS) {
    document.getElementById("loginErr").hidden = true;
    unlock();
  } else document.getElementById("loginErr").hidden = false;
};
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btnLogin").click(); });
document.getElementById("btnLogout").onclick = lock;

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("on"));
    document.getElementById("panel-" + btn.dataset.tab).classList.add("on");
    if (btn.dataset.tab === "orders") renderOrders();
  };
});

let availData = null;
async function loadAvailability() {
  if (availData) return availData;
  const res = await fetch(AVAIL_URL + "?t=" + Date.now());
  if (!res.ok) throw new Error("Brak availability.json");
  availData = await res.json();
  return availData;
}
function brandMatch(pid, pname, brand) {
  if (!brand) return true;
  const s = (pid + " " + pname).toLowerCase();
  if (brand === "elf_liq") return s.includes("elf");
  return s.includes(brand);
}
function buildIndex(data) {
  const map = [];
  for (const [id, p] of Object.entries(data.products || {})) {
    for (const a of p.available || []) {
      const name = typeof a === "string" ? a : a.name;
      map.push({ id, pname: p.name || id, flavor: name, k: norm(name), ok: true });
    }
  }
  return map;
}
function findFlavor(index, flavor, brand) {
  const q = norm(flavor);
  let hits = index.filter(x => brandMatch(x.id, x.pname, brand) && (x.k === q || x.k.includes(q) || q.includes(x.k)));
  const exact = hits.filter(x => x.k === q);
  if (exact.length) hits = exact;
  return hits.find(h => h.ok) || hits[0] || null;
}

document.getElementById("btnCheck").onclick = async () => {
  const lines = document.getElementById("list").value.split(/\r?\n/);
  document.getElementById("results").hidden = false;
  const box = document.getElementById("resultList");
  box.innerHTML = "Sprawdzam…";
  try {
    const data = await loadAvailability();
    const index = buildIndex(data);
    let nOk = 0, nBad = 0, nUnk = 0;
    const rows = [];
    for (const raw of lines) {
      if (!raw.trim()) continue;
      const p = parseLine(raw);
      if (!p) continue;
      if (p.skip) { rows.push({ kind: "skip", raw: p.raw, reason: p.reason }); continue; }
      const hit = findFlavor(index, p.flavor, p.brand);
      if (!hit) { nUnk++; rows.push({ kind: "unk", flavor: p.flavor, brand: p.brand, num: p.num, free: p.isFree }); }
      else if (hit.ok) { nOk++; rows.push({ kind: "ok", flavor: p.flavor, match: hit.flavor, product: hit.pname, num: p.num, free: p.isFree }); }
      else { nBad++; rows.push({ kind: "bad", flavor: p.flavor, match: hit.flavor, product: hit.pname, num: p.num, free: p.isFree }); }
    }
    document.getElementById("nOk").textContent = nOk;
    document.getElementById("nBad").textContent = nBad;
    document.getElementById("nUnk").textContent = nUnk;
    box.innerHTML = rows.map(r => {
      if (r.kind === "skip") return `<div class="row"><div>${esc(r.raw)}<div class="meta">${esc(r.reason)}</div></div><span class="tag skip">pominięte</span></div>`;
      const label = r.kind === "ok" ? "dostępny" : r.kind === "bad" ? "niedostępny" : "nieznany";
      const meta = r.kind === "unk" ? `szukano: ${esc(r.flavor)}` : `${esc(r.match)} · ${esc(r.product)}`;
      return `<div class="row"><div><div>${r.num ? r.num + ". " : ""}${esc(r.flavor)}${r.free ? " · GRATIS" : ""}</div><div class="meta">${meta}</div></div><span class="tag ${r.kind}">${label}</span></div>`;
    }).join("");
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
};

async function renderOrders() {
  const el = document.getElementById("ordersList");
  const summaryEl = document.getElementById("summaryBox");
  el.innerHTML = `<div class="card"><p class="hint">Ładowanie zamówień…</p></div>`;
  summaryEl.hidden = true;
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/zamowienia?order=czas.desc", {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });
    const orders = await res.json();
    if (!orders || !orders.length) {
      el.innerHTML = `<div class="card"><p class="hint">Brak zamówień.</p></div>`;
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="order-card">
        <h4>${esc(o.klient || "?")} · ${esc(o.platnosc || "")}</h4>
        <div class="meta">${esc(o.smaki || "")}</div>
        <div class="meta">${esc(o.cena || "")} · ${esc(o.czas ? new Date(o.czas).toLocaleString("pl-PL") : "")}</div>
        <div style="margin-top:.4rem"><span class="tag ${o.platnosc==="przelew"?"przelew":"gotowka"}">${o.platnosc||"gotówka"}</span></div>
      </div>
    `).join("");

    const totalLiquids = countLiquidsFromOrders(orders);
    const pricePerPiece = getLiquidPricePerPiece(totalLiquids);
    const liquidRevenue = totalLiquids * pricePerPiece;

    const cartridgeCost = 60;
    const disposableCost = 70;
    const deliveryCost = 30;
    const totalCosts = cartridgeCost + disposableCost + deliveryCost;
    const profit = liquidRevenue - totalCosts;

    const byPerson = {};
    orders.forEach(o => {
      const person = o.klient || "Nieznany";
      if (!byPerson[person]) byPerson[person] = [];
      const lines = (o.smaki || "").split(";").map(s => s.trim()).filter(Boolean);
      byPerson[person].push(...lines);
    });

    let summaryHtml = "<h3>Podsumowanie zamówień</h3>";
    for (const [person, lines] of Object.entries(byPerson)) {
      summaryHtml += `<div style="margin-bottom:0.8rem"><b>${esc(person)}</b><br>`;
      lines.forEach(l => summaryHtml += `• ${esc(l)}<br>`);
      summaryHtml += "</div>";
    }

    summaryHtml += `
      <hr style="border-color:#2a2a3a;margin:1rem 0">
      <div>
        <b>Łącznie liquidów:</b> ${totalLiquids} szt.<br>
        <b>Cena za sztukę:</b> ${pricePerPiece} zł<br>
        <b>Przychód z liquidów:</b> ${liquidRevenue} zł<br>
        <b>Koszty:</b><br>
        • Cartridge: ${cartridgeCost} zł<br>
        • Jednorazówki: ${disposableCost} zł<br>
        • Dostawa: ${deliveryCost} zł<br>
        <b>Razem koszty:</b> ${totalCosts} zł<br>
        <b style="color:#3dd68c">Zarobek na czysto: ${profit} zł</b>
      </div>
    `;

    summaryEl.innerHTML = summaryHtml;
    summaryEl.hidden = false;
  } catch(e) {
    el.innerHTML = `<div class="card"><p class="err">Błąd ładowania zamówień.</p></div>`;
  }
}

document.getElementById("btnRefreshOrders").onclick = renderOrders;

document.getElementById("btnClearOrders").onclick = async () => {
  if (!confirm("Na pewno usunąć WSZYSTKIE zamówienia z Supabase?")) return;
  try {
    await fetch(SUPABASE_URL + "/rest/v1/zamowienia", {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      }
    });
