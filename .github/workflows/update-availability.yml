name: Update liquid availability

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape availability
        run: python scrape_availability.py

      - name: Commit & push if changed
        run: |
          git config user.name "availability-bot"
          git config user.email "bot@users.noreply.github.com"
          git add availability.json
          if git diff --staged --quiet; then
            echo "Brak zmian"
          else
            git commit -m "chore: update liquid availability"
            git push
          fi
